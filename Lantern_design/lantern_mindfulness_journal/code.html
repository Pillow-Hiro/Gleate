<!-- Suppressed TopAppBar and BottomNavBar as this is a linear/transactional screen (Login) -->
<main class="flex-grow flex items-center justify-center px-margin-mobile md:px-margin-desktop py-12 relative overflow-hidden">
<!-- Subtle ambient background element to fit the 'calm background' and 'Refined Minimalism' -->
<div class="absolute inset-0 pointer-events-none flex justify-center items-center opacity-40">
<div class="w-[800px] h-[800px] rounded-full bg-gradient-to-tr from-surface-container-lowest to-surface-container opacity-50 blur-3xl"></div>
</div>
<div class="w-full max-w-[420px] relative z-10 flex flex-col gap-stack-lg">
<!-- Logo & Brand Header -->
<div class="flex flex-col items-center justify-center gap-stack-sm mb-4">

<div class="w-16 h-16 rounded-full bg-surface-container-lowest shadow-[0_4px_12px_rgba(0,0,0,0.05)] flex items-center justify-center mb-2 border border-outline-variant/20">
<span class="material-symbols-outlined text-3xl text-lantern-glow" style="font-variation-settings: 'FILL' 1;">

</div>
<h1 class="font-display text-display text-ink-black tracking-tight text-center">Lantern</h1>
<p class="font-body-md text-body-md text-on-surface-variant text-center">Mindful expression, quietly archived.</p>
</div>
<!-- Login Form Container (Minimalist, no heavy cards) -->
<div class="flex flex-col gap-stack-md bg-surface-container-lowest p-8 rounded-2xl shadow-[0_4px_12px_rgba(0,0,0,0.02)] border border-outline-variant/10">
<form action="#" class="flex flex-col gap-stack-md" method="POST">
<!-- Email Field -->
<div class="flex flex-col gap-1">
<label class="font-label-sm text-label-sm text-on-surface-variant sr-only" for="email">Email address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-0 top-1/2 -translate-y-1/2 text-on-surface-variant/50 ml-3 text-[20px]">
                                mail
                            </span>
<input class="w-full h-touch-target pl-10 pr-4 bg-transparent border-0 border-b border-outline-variant/40 focus:ring-0 focus:border-lantern-glow focus:border-b-2 font-body-md text-body-md text-ink-black placeholder:text-on-surface-variant/50 transition-colors" id="email" name="email" placeholder="Email address" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-1">
<label class="font-label-sm text-label-sm text-on-surface-variant sr-only" for="password">Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-0 top-1/2 -translate-y-1/2 text-on-surface-variant/50 ml-3 text-[20px]">

                            </span>

</div>
<div class="flex justify-end mt-2">
<a class="font-label-md text-label-md text-on-surface-variant hover:text-ink-black transition-colors" href="#">Forgot password?</a>
</div>
</div>

<div class="mt-4">
<button class="w-full h-touch-target bg-lantern-glow text-ink-black font-label-md text-label-md rounded-full hover:opacity-90 active:scale-95 transition-all shadow-[0_4px_12px_rgba(251,176,59,0.2)] flex items-center justify-center gap-2" type="submit">

</button>
</div>
