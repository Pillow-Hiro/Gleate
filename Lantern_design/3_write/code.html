<body class="bg-background text-on-surface min-h-screen flex flex-col antialiased">
<!-- TopAppBar -->
<header class="w-full sticky top-0 bg-surface dark:bg-surface border-b border-outline-variant/30 dark:border-outline/20 z-40 transition-shadow" id="top-bar">
<div class="flex justify-between items-center px-margin-mobile h-touch-target w-full max-w-[680px] mx-auto">
<button class="h-touch-target w-touch-target flex items-center justify-center -ml-2 text-primary dark:text-inverse-primary hover:opacity-80 transition-opacity active:scale-95 duration-150 rounded-full focus:outline-none focus:ring-2 focus:ring-primary/20">
<span class="material-symbols-outlined" data-icon="menu">menu</span>
</button>
<h1 class="font-display text-display text-ink-black dark:text-paper-white tracking-tight flex-1 text-center">Lantern</h1>
<div class="h-touch-target flex items-center justify-end -mr-2">
<button class="px-4 py-2 bg-primary-container text-on-primary-container font-label-md text-label-md rounded-full hover:opacity-90 transition-opacity font-semibold">
                    Done
                </button>
</div>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 w-full max-w-[680px] mx-auto px-margin-mobile py-stack-lg pb-32 flex flex-col relative">
<!-- Date Meta -->
<div class="mb-stack-md flex items-center text-on-surface-variant font-label-md text-label-md space-x-2">
<span class="material-symbols-outlined text-[18px]" data-icon="calendar_today">calendar_today</span>
<span>October 24, 2023</span>
<span class="text-outline-variant px-1">•</span>
<span>10:42 AM</span>
</div>
<!-- Title Input -->
<div class="mb-stack-md relative group">
<input class="w-full bg-transparent border-none focus:ring-0 p-0 font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-surface placeholder-on-surface-variant outline-none" placeholder="Title..." style="box-shadow: none;" type="text"/>
<div class="absolute bottom-0 left-0 w-full h-[2px] bg-lantern-glow scale-x-0 group-focus-within:scale-x-100 transition-transform origin-left duration-300"></div>
</div>
<!-- Body Editor -->
<div class="flex-1 relative cursor-text group" id="editor-container" onclick="document.getElementById('editor-body').focus()">
<div class="w-full h-full min-h-[300px] outline-none font-body-lg text-body-lg text-on-surface whitespace-pre-wrap leading-relaxed py-2" id="editor-body" placeholder="Start writing..."></div>
</div>
</main>
<!-- Formatting Toolbar (Sticky Bottom) -->
<div class="fixed bottom-16 md:bottom-0 w-full bg-surface/90 backdrop-blur-md border-t border-outline-variant/30 z-30 transform transition-transform duration-300 translate-y-0" id="format-toolbar">
<div class="max-w-[680px] mx-auto px-margin-mobile h-14 flex items-center space-x-4 overflow-x-auto hide-scrollbar">
<button class="h-10 w-10 flex-shrink-0 flex items-center justify-center text-on-surface-variant hover:text-primary transition-colors rounded-full hover:bg-surface-variant/50">
<span class="material-symbols-outlined" data-icon="format_bold">format_bold</span>
</button>
<button class="h-10 w-10 flex-shrink-0 flex items-center justify-center text-on-surface-variant hover:text-primary transition-colors rounded-full hover:bg-surface-variant/50">
<span class="material-symbols-outlined" data-icon="format_italic">format_italic</span>
</button>
<button class="h-10 w-10 flex-shrink-0 flex items-center justify-center text-on-surface-variant hover:text-primary transition-colors rounded-full hover:bg-surface-variant/50">
<span class="material-symbols-outlined" data-icon="format_list_bulleted">format_list_bulleted</span>
</button>
<div class="w-[1px] h-6 bg-outline-variant/30 mx-2 flex-shrink-0"></div>
<button class="h-10 w-10 flex-shrink-0 flex items-center justify-center text-on-surface-variant hover:text-primary transition-colors rounded-full hover:bg-surface-variant/50">
<span class="material-symbols-outlined" data-icon="image">image</span>
</button>
<button class="h-10 w-10 flex-shrink-0 flex items-center justify-center text-on-surface-variant hover:text-primary transition-colors rounded-full hover:bg-surface-variant/50">
<span class="material-symbols-outlined" data-icon="attach_file">attach_file</span>
</button>
<div class="flex-1"></div>
<span class="text-on-surface-variant font-label-sm text-label-sm whitespace-nowrap" id="word-count">0 words</span>
</div>
</div>
<!-- BottomNavBar (Hidden on MD for pure focus, shown on mobile) -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center h-16 pb-safe px-4 bg-surface/90 backdrop-blur-md dark:bg-surface/90 border-t border-outline-variant/30 dark:border-outline/20 md:hidden transition-transform duration-300" id="bottom-nav">
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline hover:text-primary dark:hover:text-lantern-glow transition-all w-16" href="#">
<span class="material-symbols-outlined mb-1" data-icon="home">home</span>
<span class="font-label-sm text-label-sm-mobile">Home</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline hover:text-primary dark:hover:text-lantern-glow transition-all w-16" href="#">
<span class="material-symbols-outlined mb-1" data-icon="auto_stories">auto_stories</span>
<span class="font-label-sm text-label-sm-mobile">Archive</span>
</a>
<a class="flex flex-col items-center justify-center text-primary dark:text-lantern-glow font-semibold transition-all w-16 transform scale-90" href="#">
<span class="material-symbols-outlined mb-1" data-icon="edit_note" data-weight="fill" style="font-variation-settings: 'FILL' 1;">edit_note</span>
<span class="font-label-sm text-label-sm-mobile">Write</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline hover:text-primary dark:hover:text-lantern-glow transition-all w-16" href="#">
<span class="material-symbols-outlined mb-1" data-icon="analytics">analytics</span>
<span class="font-label-sm text-label-sm-mobile">Insights</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline hover:text-primary dark:hover:text-lantern-glow transition-all w-16" href="#">
<span class="material-symbols-outlined mb-1" data-icon="settings">settings</span>
<span class="font-label-sm text-label-sm-mobile">Settings</span>
</a>
</nav>
<script>
        // Simple word count logic
        const editor = document.getElementById('editor-body');
        const wordCountDisplay = document.getElementById('word-count');
        const bottomNav = document.getElementById('bottom-nav');
        const formatToolbar = document.getElementById('format-toolbar');
        const topBar = document.getElementById('top-bar');

        editor.addEventListener('input', () => {
            const text = editor.innerText.trim();
            const words = text ? text.split(/\s+/).length : 0;
            wordCountDisplay.innerText = `${words} word${words !== 1 ? 's' : ''}`;
        });

        // Hide navigation on scroll down for focused writing
        let lastScrollTop = 0;
        window.addEventListener('scroll', () => {
            let scrollTop = window.pageYOffset || document.documentElement.scrollTop;
            if (scrollTop > lastScrollTop && scrollTop > 100) {
                // Scroll Down
                bottomNav.style.transform = 'translateY(100%)';
                formatToolbar.style.transform = 'translateY(100%)';
                topBar.classList.add('shadow-sm');
            } else {
                // Scroll Up
                bottomNav.style.transform = 'translateY(0)';
                formatToolbar.style.transform = 'translateY(0)';
                if(scrollTop <= 10) topBar.classList.remove('shadow-sm');
            }
            lastScrollTop = scrollTop <= 0 ? 0 : scrollTop;
        }, false);
    </script>
</body></html>
