<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>目標 — Creator Companion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400;500&family=Noto+Sans+JP:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --ink: #1a1814; --ink-soft: #5a5650; --ink-faint: #9a9490;
    --paper: #f7f4ef; --paper-warm: #ede9e2; --accent: #7c6a52;
    --accent-light: #c4b49a; --green-soft: #e8ede4; --green-ink: #3d5c3a;
    --border: #d8d3cc;
  }
  body { font-family: 'Noto Sans JP', sans-serif; background: var(--paper); color: var(--ink); min-height: 100vh; font-size: 15px; line-height: 1.8; }
  header { border-bottom: 1px solid var(--border); padding: 1.5rem 2rem; display: flex; align-items: baseline; gap: 1rem; background: var(--paper); }
  .logo { font-family: 'Noto Serif JP', serif; font-size: 1.1rem; font-weight: 400; letter-spacing: 0.05em; }
  .logo span { color: var(--accent); }
  nav a { font-size: 0.8rem; color: var(--ink-faint); text-decoration: none; margin-left: 1.5rem; }
  nav a:hover { color: var(--accent); }
  nav a.active { color: var(--accent); }
  .main { max-width: 680px; margin: 0 auto; padding: 3rem 2rem; }
  .date-line { font-size: 0.75rem; color: var(--ink-faint); letter-spacing: 0.08em; margin-bottom: 2.5rem; display: flex; align-items: center; gap: 1rem; }
  .date-line::after { content: ''; flex: 1; height: 1px; background: var(--border); }
  .section-label { font-size: 0.82rem; color: var(--ink-soft); margin-bottom: 0.5rem; }
  .divider { border: none; border-top: 1px solid var(--border); margin: 2.5rem 0; }

  /* Vision */
  .vision-box {
    background: var(--paper-warm);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 1.25rem 1.5rem;
    margin-bottom: 0.75rem;
  }
  .vision-text {
    font-family: 'Noto Serif JP', serif;
    font-size: 1rem;
    font-weight: 400;
    color: var(--ink);
    line-height: 1.8;
    margin-bottom: 0.75rem;
  }
  .vision-empty {
    font-size: 0.85rem;
    color: var(--ink-faint);
    margin-bottom: 1rem;
    line-height: 1.8;
  }
  .link-btn {
    font-size: 0.78rem;
    color: var(--accent);
    background: none;
    border: none;
    cursor: pointer;
    padding: 0;
    text-decoration: underline;
    font-family: 'Noto Sans JP', sans-serif;
  }

  /* Interview */
  .interview-wrap {
    border: 1px solid var(--border);
    border-radius: 4px;
    overflow: hidden;
    margin-top: 1rem;
  }
  .chat-log {
    padding: 1.25rem;
    max-height: 320px;
    overflow-y: auto;
    background: var(--paper);
  }
  .chat-msg {
    margin-bottom: 1rem;
    display: flex;
    flex-direction: column;
  }
  .chat-msg.ai { align-items: flex-start; }
  .chat-msg.user { align-items: flex-end; }
  .chat-bubble {
    max-width: 85%;
    padding: 0.7rem 1rem;
    border-radius: 4px 14px 14px 14px;
    font-size: 0.88rem;
    line-height: 1.7;
    white-space: pre-line;
  }
  .chat-bubble.ai { background: var(--green-soft); color: var(--ink); }
  .chat-bubble.user { background: var(--paper-warm); color: var(--ink); border-radius: 14px 14px 4px 14px; }
  .chat-from { font-size: 0.7rem; color: var(--ink-faint); margin-bottom: 0.2rem; }

  .chat-input-wrap {
    border-top: 1px solid var(--border);
    padding: 0.75rem 1rem;
    display: flex;
    gap: 0.75rem;
    background: var(--paper-warm);
  }
  .chat-input {
    flex: 1;
    background: var(--paper);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 0.5rem 0.75rem;
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 0.88rem;
    color: var(--ink);
    outline: none;
    resize: none;
    line-height: 1.5;
  }
  .chat-input:focus { border-color: var(--accent); }
  .send-btn {
    background: var(--ink);
    color: var(--paper);
    border: none;
    padding: 0.5rem 1.25rem;
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 0.82rem;
    border-radius: 4px;
    cursor: pointer;
    transition: background 0.2s;
    align-self: flex-end;
  }
  .send-btn:hover { background: var(--accent); }
  .send-btn:disabled { background: var(--ink-faint); cursor: not-allowed; }

  .vision-confirm {
    background: var(--green-soft);
    border: 1px solid rgba(61, 92, 58, 0.2);
    border-radius: 4px;
    padding: 1rem 1.25rem;
    margin-top: 1rem;
    display: none;
  }
  .vision-confirm-text {
    font-size: 0.9rem;
    color: var(--ink-soft);
    margin-bottom: 0.75rem;
  }
  .vision-confirm-value {
    font-family: 'Noto Serif JP', serif;
    font-size: 1rem;
    color: var(--ink);
    margin-bottom: 1rem;
  }

  /* Goal section */
  .goal-section { margin-bottom: 0.5rem; }
  textarea.goal-input {
    width: 100%;
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--border);
    padding: 0.5rem 0;
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 0.95rem;
    color: var(--ink);
    resize: none;
    outline: none;
    line-height: 1.7;
    min-height: 44px;
    transition: border-color 0.2s;
  }
  textarea.goal-input:focus { border-bottom-color: var(--accent); }
  textarea.goal-input::placeholder { color: var(--ink-faint); font-size: 0.85rem; }

  .goal-actions { display: flex; gap: 0.75rem; margin-top: 0.75rem; align-items: center; flex-wrap: wrap; }
  .save-btn {
    background: var(--ink);
    color: var(--paper);
    border: none;
    padding: 0.6rem 1.5rem;
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 0.82rem;
    cursor: pointer;
    border-radius: 2px;
    transition: background 0.2s;
  }
  .save-btn:hover { background: var(--accent); }
  .save-btn:disabled { background: var(--ink-faint); cursor: not-allowed; }
  .suggest-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--ink-soft);
    padding: 0.55rem 1rem;
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 0.78rem;
    cursor: pointer;
    border-radius: 2px;
    transition: border-color 0.2s, color 0.2s;
  }
  .suggest-btn:hover { border-color: var(--accent); color: var(--accent); }
  .saved-notice { font-size: 0.75rem; color: var(--green-ink); display: none; }
  .saved-notice.visible { display: inline; }

  .suggestion-box {
    margin-top: 0.75rem;
    padding: 0.85rem 1rem;
    background: var(--green-soft);
    border-radius: 4px 12px 12px 12px;
    border: 1px solid rgba(61,92,58,0.15);
    font-size: 0.85rem;
    color: var(--ink-soft);
    line-height: 1.7;
    white-space: pre-line;
  }
  .suggestion-from { font-size: 0.72rem; color: var(--green-ink); margin-bottom: 0.4rem; font-weight: 500; }
  .use-suggestion-btn {
    margin-top: 0.5rem;
    font-size: 0.75rem;
    color: var(--accent);
    background: none;
    border: none;
    cursor: pointer;
    padding: 0;
    text-decoration: underline;
    font-family: 'Noto Sans JP', sans-serif;
  }

  @media (max-width: 600px) { .main { padding: 2rem 1.25rem; } }
</style>
</head>
<body>
<header>
  <div class="logo">Creator <span>Companion</span></div>
  <nav>
    <a href="/">今日</a>
    <a href="/goals" class="active">目標</a>
    <a href="/review">振り返り</a>
    <a href="/logs">履歴</a>
  </nav>
</header>

<div class="main">
  <div class="date-line">目標</div>

  <!-- Vision -->
  <div class="section-label">ビジョン</div>
  <div class="goal-section">
    <div class="vision-box" id="vision-display" style="{{ 'display:none' if not goals.vision else '' }}">
      <div class="vision-text" id="vision-text">{{ goals.vision }}</div>
      <button class="link-btn" onclick="showInterview()">編集する</button>
    </div>
    <div id="vision-empty" style="{{ 'display:none' if goals.vision else '' }}">
      <div class="vision-empty">あなたのビジョン（大きな目標）を言葉にしましょう。<br>AIとの会話を通じて、自分の言葉で書き出せます。</div>
      <button class="save-btn" onclick="showInterview()">AIと一緒に言葉にする</button>
    </div>

    <div id="interview-section" style="display:none; margin-top:1rem;">
      <div class="interview-wrap">
        <div class="chat-log" id="chat-log"></div>
        <div class="chat-input-wrap">
          <textarea class="chat-input" id="chat-input" rows="1" placeholder="ここに入力してEnterで送信"></textarea>
          <button class="send-btn" id="send-btn" onclick="sendMessage()">送信</button>
        </div>
      </div>
      <div class="vision-confirm" id="vision-confirm">
        <div class="vision-confirm-text">このビジョンで保存しますか？</div>
        <div class="vision-confirm-value" id="vision-confirm-value"></div>
        <div style="display:flex;gap:0.75rem;">
          <button class="save-btn" onclick="saveVision()">保存する</button>
          <button class="suggest-btn" onclick="hideVisionConfirm()">続けて話す</button>
        </div>
      </div>
    </div>
  </div>

  <hr class="divider">

  <!-- Monthly goal -->
  <div class="section-label">今月の目標 <span style="color:var(--ink-faint);font-size:0.75rem;">{{ month_str }}</span></div>
  <div class="goal-section">
    <textarea class="goal-input" id="monthly-goal" rows="2"
      placeholder="今月、何に集中しますか？">{{ current_monthly }}</textarea>
    <div class="goal-actions">
      <button class="save-btn" onclick="saveGoal('monthly')">保存</button>
      <button class="suggest-btn" onclick="suggestGoal('monthly')">AIに提案してもらう</button>
      <span class="saved-notice" id="monthly-notice">保存しました</span>
    </div>
    <div id="monthly-suggestion" style="display:none" class="suggestion-box">
      <div class="suggestion-from">Creator Companion</div>
      <div id="monthly-suggestion-text"></div>
      <button class="use-suggestion-btn" onclick="useSuggestion('monthly')">この提案を使う</button>
    </div>
  </div>

  <hr class="divider">

  <!-- Weekly goal -->
  <div class="section-label">今週の目標 <span style="color:var(--ink-faint);font-size:0.75rem;">{{ week_str }}</span></div>
  <div class="goal-section">
    <textarea class="goal-input" id="weekly-goal" rows="2"
      placeholder="今週、一番大切にすることは？">{{ current_weekly }}</textarea>
    <div class="goal-actions">
      <button class="save-btn" onclick="saveGoal('weekly')">保存</button>
      <button class="suggest-btn" onclick="suggestGoal('weekly')">AIに提案してもらう</button>
      <span class="saved-notice" id="weekly-notice">保存しました</span>
    </div>
    <div id="weekly-suggestion" style="display:none" class="suggestion-box">
      <div class="suggestion-from">Creator Companion</div>
      <div id="weekly-suggestion-text"></div>
      <button class="use-suggestion-btn" onclick="useSuggestion('weekly')">この提案を使う</button>
    </div>
  </div>
</div>

<script>
  let chatMessages = [];
  let pendingVision = null;

  function showInterview() {
    document.getElementById('interview-section').style.display = 'block';
    if (chatMessages.length === 0) startInterview();
  }

  async function startInterview() {
    const res = await fetch('/goals/interview', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({messages: []})
    });
    const data = await res.json();
    appendChatBubble('ai', data.response);
  }

  function appendChatBubble(role, text) {
    const log = document.getElementById('chat-log');
    const wrap = document.createElement('div');
    wrap.className = `chat-msg ${role}`;
    const from = document.createElement('div');
    from.className = 'chat-from';
    from.textContent = role === 'ai' ? 'Creator Companion' : 'あなた';
    const bubble = document.createElement('div');
    bubble.className = `chat-bubble ${role}`;
    bubble.textContent = text;
    wrap.appendChild(from);
    wrap.appendChild(bubble);
    log.appendChild(wrap);
    log.scrollTop = log.scrollHeight;
  }

  async function sendMessage() {
    const input = document.getElementById('chat-input');
    const text = input.value.trim();
    if (!text) return;

    appendChatBubble('user', text);
    chatMessages.push({role: 'user', content: text});
    input.value = '';
    input.style.height = 'auto';

    const btn = document.getElementById('send-btn');
    btn.disabled = true;

    chatMessages.push({role: 'assistant', content: '...'});
    const res = await fetch('/goals/interview', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({messages: chatMessages.slice(0, -1)})
    });
    chatMessages.pop();

    const data = await res.json();
    chatMessages.push({role: 'assistant', content: data.response});
    appendChatBubble('ai', data.response);
    btn.disabled = false;

    if (data.vision) {
      pendingVision = data.vision;
      document.getElementById('vision-confirm-value').textContent = data.vision;
      document.getElementById('vision-confirm').style.display = 'block';
    }
  }

  function hideVisionConfirm() {
    document.getElementById('vision-confirm').style.display = 'none';
  }

  async function saveVision() {
    if (!pendingVision) return;
    await fetch('/goals/save', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({type: 'vision', vision: pendingVision})
    });
    document.getElementById('vision-text').textContent = pendingVision;
    document.getElementById('vision-display').style.display = 'block';
    document.getElementById('vision-empty').style.display = 'none';
    document.getElementById('interview-section').style.display = 'none';
    document.getElementById('vision-confirm').style.display = 'none';
    chatMessages = [];
    pendingVision = null;
  }

  async function saveGoal(type) {
    const val = document.getElementById(`${type}-goal`).value.trim();
    await fetch('/goals/save', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({type, goal: val})
    });
    const notice = document.getElementById(`${type}-notice`);
    notice.classList.add('visible');
    setTimeout(() => notice.classList.remove('visible'), 2500);
  }

  async function suggestGoal(type) {
    const btn = event.target;
    btn.disabled = true;
    btn.textContent = '提案中...';

    const res = await fetch('/goals/suggest', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({type})
    });
    const data = await res.json();

    document.getElementById(`${type}-suggestion-text`).textContent = data.suggestion;
    document.getElementById(`${type}-suggestion`).style.display = 'block';

    btn.disabled = false;
    btn.textContent = 'AIに提案してもらう';
  }

  function useSuggestion(type) {
    const text = document.getElementById(`${type}-suggestion-text`).textContent;
    // Use only the first sentence as the goal
    const firstLine = text.split(/[。\n]/)[0];
    document.getElementById(`${type}-goal`).value = firstLine;
    document.getElementById(`${type}-suggestion`).style.display = 'none';
  }

  // Auto-resize chat input
  document.getElementById('chat-input').addEventListener('input', function() {
    this.style.height = 'auto';
    this.style.height = Math.min(this.scrollHeight, 100) + 'px';
  });
  document.getElementById('chat-input').addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });
</script>
</body>
</html>
