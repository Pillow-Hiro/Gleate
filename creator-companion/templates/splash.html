<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lantern</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400&family=Noto+Sans+JP:wght@300;400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: 'Noto Sans JP', sans-serif;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    cursor: pointer;
    background: #0d0d10;
  }
  .splash {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .splash-bg {
    position: absolute;
    inset: 0;
    background: linear-gradient(160deg, #1a1a2e 0%, #16213e 55%, #0f3460 100%);
    background-size: cover;
    background-position: center;
    opacity: 0;
    transition: opacity 1.4s ease;
  }
  .splash-bg.show { opacity: 1; }
  .splash-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(
      to bottom,
      rgba(0,0,0,0.28) 0%,
      rgba(0,0,0,0.18) 40%,
      rgba(0,0,0,0.58) 100%
    );
  }
  .splash-content {
    position: relative;
    z-index: 10;
    text-align: center;
    padding: 2rem 2.5rem;
    max-width: 420px;
    width: 100%;
  }
  .splash-logo {
    font-family: 'Noto Serif JP', serif;
    font-size: clamp(1.8rem, 7vw, 2.75rem);
    font-weight: 300;
    color: #fff;
    letter-spacing: 0.22em;
    margin-bottom: 1.75rem;
    opacity: 0;
    transform: translateY(18px);
    transition: opacity 0.9s ease 0.3s, transform 0.9s ease 0.3s;
  }
  .splash-logo.show { opacity: 1; transform: translateY(0); }
  .splash-quote {
    font-size: clamp(0.88rem, 3.8vw, 1rem);
    font-weight: 300;
    color: rgba(255,255,255,0.88);
    line-height: 1.9;
    letter-spacing: 0.05em;
    min-height: 1.9em;
    opacity: 0;
    transform: translateY(12px);
    transition: opacity 0.8s ease 0.85s, transform 0.8s ease 0.85s;
  }
  .splash-quote.show { opacity: 1; transform: translateY(0); }
  .splash-hint {
    position: absolute;
    bottom: 4rem;
    left: 0; right: 0;
    text-align: center;
    font-size: 0.68rem;
    color: rgba(255,255,255,0.35);
    letter-spacing: 0.12em;
    z-index: 10;
    opacity: 0;
    transition: opacity 0.6s ease 1.8s;
  }
  .splash-hint.show { opacity: 1; }
  .splash-credit {
    position: absolute;
    bottom: 1.25rem;
    right: 1rem;
    font-size: 0.58rem;
    color: rgba(255,255,255,0.28);
    letter-spacing: 0.04em;
    z-index: 10;
    display: none;
  }
  .splash-progress {
    position: absolute;
    bottom: 0; left: 0;
    height: 2px;
    background: rgba(255,255,255,0.38);
    width: 0;
    z-index: 10;
  }
</style>
</head>
<body onclick="goNext()">

<div class="splash">
  <div class="splash-bg" id="splash-bg"></div>
  <div class="splash-overlay"></div>
  <div class="splash-content">
    <div class="splash-logo" id="splash-logo">Lantern</div>
    <div class="splash-quote" id="splash-quote"></div>
  </div>
  <div class="splash-hint" id="splash-hint">タップして続ける</div>
  <div class="splash-credit" id="splash-credit"></div>
  <div class="splash-progress" id="splash-progress"></div>
</div>

<script>
  const NEXT_URL = {{ next_url | tojson }};
  const DURATION = 4000;
  const FALLBACKS = [
    '小さな一歩が、大きな旅になる。',
    '続けることに、やがて意味が宿る。',
    '昨日より少しでも前へ、それで十分。',
    '迷いながら進む人が、一番遠くへ行く。',
    '今日も記録することが、すでに答えだ。',
  ];
  let redirected = false;

  function goNext() {
    if (redirected) return;
    redirected = true;
    window.location.href = NEXT_URL;
  }

  // Set random fallback quote immediately while waiting for AI
  document.getElementById('splash-quote').textContent =
    FALLBACKS[Math.floor(Math.random() * FALLBACKS.length)];

  // Trigger animations
  document.getElementById('splash-bg').classList.add('show');
  setTimeout(() => {
    document.getElementById('splash-logo').classList.add('show');
    document.getElementById('splash-quote').classList.add('show');
    document.getElementById('splash-hint').classList.add('show');
  }, 50);

  // Progress bar (double rAF ensures CSS transition fires)
  requestAnimationFrame(() => requestAnimationFrame(() => {
    const prog = document.getElementById('splash-progress');
    prog.style.transition = 'width ' + DURATION + 'ms linear';
    prog.style.width = '100%';
  }));

  // Auto redirect
  setTimeout(goNext, DURATION + 100);

  // Fetch real content (AI quote + Unsplash photo) async
  fetch('/api/splash/content')
    .then(r => r.json())
    .then(data => {
      if (data.quote) {
        document.getElementById('splash-quote').textContent = data.quote;
      }
      if (data.photo_url) {
        const img = new Image();
        img.onload = () => {
          const bg = document.getElementById('splash-bg');
          bg.style.backgroundImage = "url('" + data.photo_url.replace(/'/g, "\\'") + "')";
        };
        img.src = data.photo_url;
        if (data.photographer) {
          const credit = document.getElementById('splash-credit');
          credit.textContent = 'Photo by ' + data.photographer + ' / Unsplash';
          credit.style.display = 'block';
        }
      }
    })
    .catch(() => {});
</script>
</body>
</html>
