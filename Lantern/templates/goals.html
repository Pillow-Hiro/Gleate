{% extends 'base.html' %}
{% block title %}目標 — Lantern{% endblock %}

{% block head %}
<style>
  .date-line {
    font-size: 0.75rem;
    color: var(--ink-faint);
    letter-spacing: 0.08em;
    margin-bottom: 2.5rem;
    display: flex;
    align-items: center;
    gap: 1rem;
  }
  .date-line::after { content: ''; flex: 1; height: 1px; background: var(--border); }

  .section-label { font-size: 0.82rem; color: var(--ink-soft); margin-bottom: 0.5rem; }

  /* Vision */
  .vision-box {
    background: var(--paper-warm);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 1.25rem 1.5rem;
    margin-bottom: 0.75rem;
  }
  .vision-text {
    font-family: 'Noto Serif JP', serif;
    font-size: 1rem;
    font-weight: 400;
    color: var(--ink);
    line-height: 1.8;
    margin-bottom: 0.75rem;
  }
  .vision-empty { font-size: 0.85rem; color: var(--ink-faint); margin-bottom: 1rem; line-height: 1.8; }
  .link-btn {
    font-size: 0.78rem;
    color: var(--accent);
    background: none;
    border: none;
    cursor: pointer;
    padding: 0;
    text-decoration: underline;
    font-family: 'Noto Sans JP', sans-serif;
  }

  /* Interview */
  .interview-wrap { border: 1px solid var(--border); border-radius: 4px; overflow: hidden; margin-top: 1rem; }
  .chat-log { padding: 1.25rem; max-height: 320px; overflow-y: auto; background: var(--paper); }
  .chat-msg { margin-bottom: 1rem; display: flex; flex-direction: column; }
  .chat-msg.ai { align-items: flex-start; }
  .chat-msg.user { align-items: flex-end; }
  .chat-bubble {
    max-width: 85%;
    padding: 0.7rem 1rem;
    border-radius: 4px 14px 14px 14px;
    font-size: 0.88rem;
    line-height: 1.7;
    white-space: pre-line;
  }
  .chat-bubble.ai { background: var(--green-soft); color: var(--ink); }
  .chat-bubble.user { background: var(--paper-warm); color: var(--ink); border-radius: 14px 14px 4px 14px; }
  .chat-from { font-size: 0.7rem; color: var(--ink-faint); margin-bottom: 0.2rem; }

  .chat-input-wrap {
    border-top: 1px solid var(--border);
    padding: 0.75rem 1rem;
    display: flex;
    gap: 0.75rem;
    background: var(--paper-warm);
  }
  .chat-input {
    flex: 1;
    background: var(--paper);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 0.5rem 0.75rem;
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 0.88rem;
    color: var(--ink);
    outline: none;
    resize: none;
    line-height: 1.5;
  }
  .chat-input:focus { border-color: var(--accent); }
  .send-btn {
    background: var(--ink);
    color: var(--paper);
    border: none;
    padding: 0.5rem 1.25rem;
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 0.82rem;
    border-radius: 4px;
    cursor: pointer;
    transition: background 0.2s;
    align-self: flex-end;
  }
  .send-btn:hover { background: var(--accent); }
  .send-btn:disabled { background: var(--ink-faint); cursor: not-allowed; }

  .vision-confirm {
    background: var(--green-soft);
    border: 1px solid rgba(61, 92, 58, 0.2);
    border-radius: 4px;
    padding: 1rem 1.25rem;
    margin-top: 1rem;
    display: none;
  }
  .vision-confirm-text { font-size: 0.9rem; color: var(--ink-soft); margin-bottom: 0.75rem; }
  .vision-confirm-value { font-family: 'Noto Serif JP', serif; font-size: 1rem; color: var(--ink); margin-bottom: 1rem; }

  /* Goal section */
  .goal-section { margin-bottom: 0.5rem; }
  textarea.goal-input {
    width: 100%;
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--border);
    padding: 0.5rem 0;
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 0.95rem;
    color: var(--ink);
    resize: none;
    outline: none;
    line-height: 1.7;
    min-height: 44px;
    transition: border-color 0.2s;
  }
  textarea.goal-input:focus { border-bottom-color: var(--accent); }
  textarea.goal-input::placeholder { color: var(--ink-faint); font-size: 0.85rem; }

  .goal-actions { display: flex; gap: 0.75rem; margin-top: 0.75rem; align-items: center; flex-wrap: wrap; }
  .suggest-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--ink-soft);
    padding: 0.55rem 1rem;
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 0.78rem;
    cursor: pointer;
    border-radius: 2px;
    transition: border-color 0.2s, color 0.2s;
  }
  .suggest-btn:hover { border-color: var(--accent); color: var(--accent); }

  .suggestion-box {
    margin-top: 0.75rem;
    padding: 0.85rem 1rem;
    background: var(--green-soft);
    border-radius: 4px 12px 12px 12px;
    border: 1px solid rgba(61,92,58,0.15);
    font-size: 0.85rem;
    color: var(--ink-soft);
    line-height: 1.7;
    white-space: pre-line;
  }
  .suggestion-from { font-size: 0.72rem; color: var(--green-ink); margin-bottom: 0.4rem; font-weight: 500; }
  .use-suggestion-btn {
    margin-top: 0.5rem;
    font-size: 0.75rem;
    color: var(--accent);
    background: none;
    border: none;
    cursor: pointer;
    padding: 0;
    text-decoration: underline;
    font-family: 'Noto Sans JP', sans-serif;
  }
</style>
{% endblock %}

{% block content %}
<div class="main">
  <div class="date-line">目標</div>

  <!-- Vision -->
  <div class="section-label">ビジョン</div>
  <div class="goal-section">
    <textarea class="goal-input" id="vision-input" rows="2"
      placeholder="あなたのビジョン（大きな目標）を書いてみましょう">{{ goals.vision }}</textarea>
    <div class="goal-actions">
      <button class="save-btn" onclick="saveVisionDirect()">保存</button>
      <button class="suggest-btn" onclick="toggleInterview()">AIと一緒に考える</button>
      <span class="saved-notice" id="vision-notice">保存しました</span>
    </div>

    <div id="interview-section" style="display:none; margin-top:1rem;">
      <div class="interview-wrap">
        <div class="chat-log" id="chat-log"></div>
        <div class="chat-input-wrap">
          <textarea class="chat-input" id="chat-input" rows="1" placeholder="ここに入力してEnterで送信"></textarea>
          <button class="send-btn" id="send-btn" onclick="sendMessage()">送信</button>
        </div>
      </div>
    </div>
  </div>

  <hr class="divider">

  <!-- Monthly goal -->
  <div class="section-label">今月の目標 <span style="color:var(--ink-faint);font-size:0.75rem;">{{ month_display }}</span></div>
  <div class="goal-section">
    <textarea class="goal-input" id="monthly-goal" rows="2"
      placeholder="今月、何に集中しますか？">{{ current_monthly }}</textarea>
    <div class="goal-actions">
      <button class="save-btn" onclick="saveGoal('monthly')">保存</button>
      <button class="suggest-btn" onclick="suggestGoal('monthly')">AIに提案してもらう</button>
      <span class="saved-notice" id="monthly-notice">保存しました</span>
    </div>
    <div id="monthly-suggestion" style="display:none" class="suggestion-box">
      <div class="suggestion-from">Lantern</div>
      <div id="monthly-suggestion-text"></div>
      <button class="use-suggestion-btn" onclick="useSuggestion('monthly')">この提案を使う</button>
    </div>
  </div>

  <hr class="divider">

  <!-- Weekly goal -->
  <div class="section-label">今週の目標 <span style="color:var(--ink-faint);font-size:0.75rem;">{{ week_display }}</span></div>
  <div class="goal-section">
    <textarea class="goal-input" id="weekly-goal" rows="2"
      placeholder="今週、一番大切にすることは？">{{ current_weekly }}</textarea>
    <div class="goal-actions">
      <button class="save-btn" onclick="saveGoal('weekly')">保存</button>
      <button class="suggest-btn" onclick="suggestGoal('weekly')">AIに提案してもらう</button>
      <span class="saved-notice" id="weekly-notice">保存しました</span>
    </div>
    <div id="weekly-suggestion" style="display:none" class="suggestion-box">
      <div class="suggestion-from">Lantern</div>
      <div id="weekly-suggestion-text"></div>
      <button class="use-suggestion-btn" onclick="useSuggestion('weekly')">この提案を使う</button>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
  let chatMessages = [];
  let interviewStarted = false;

  function toggleInterview() {
    const section = document.getElementById('interview-section');
    const hidden = section.style.display === 'none' || section.style.display === '';
    section.style.display = hidden ? 'block' : 'none';
    if (hidden && !interviewStarted) {
      interviewStarted = true;
      startInterview();
    }
  }

  async function startInterview() {
    const res = await fetch('/goals/interview', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({messages: []})
    });
    const data = await res.json();
    chatMessages.push({role: 'assistant', content: data.response});
    appendChatBubble('ai', data.response);
  }

  function appendChatBubble(role, text) {
    const log = document.getElementById('chat-log');
    const wrap = document.createElement('div');
    wrap.className = `chat-msg ${role}`;
    const from = document.createElement('div');
    from.className = 'chat-from';
    from.textContent = role === 'ai' ? 'Lantern' : 'あなた';
    const bubble = document.createElement('div');
    bubble.className = `chat-bubble ${role}`;
    bubble.textContent = text;
    wrap.appendChild(from);
    wrap.appendChild(bubble);
    log.appendChild(wrap);
    log.scrollTop = log.scrollHeight;
  }

  async function sendMessage() {
    const input = document.getElementById('chat-input');
    const text = input.value.trim();
    if (!text) return;

    appendChatBubble('user', text);
    chatMessages.push({role: 'user', content: text});
    input.value = '';
    input.style.height = 'auto';

    const btn = document.getElementById('send-btn');
    btn.disabled = true;

    const res = await fetch('/goals/interview', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({messages: chatMessages})
    });
    const data = await res.json();
    const displayText = data.response.replace(/【ビジョン[:：].+?】/g, '').trim();
    chatMessages.push({role: 'assistant', content: data.response});
    appendChatBubble('ai', displayText);
    btn.disabled = false;

    if (data.vision) {
      const visionInput = document.getElementById('vision-input');
      visionInput.value = data.vision;
      visionInput.style.height = 'auto';
      visionInput.style.height = visionInput.scrollHeight + 'px';
      appendChatBubble('ai', 'ビジョンをテキストボックスに反映しました。編集して「保存」ボタンで保存できます。');
    }
  }

  async function saveVisionDirect() {
    const vision = document.getElementById('vision-input').value.trim();
    await fetch('/api/vision', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({vision})
    });
    const notice = document.getElementById('vision-notice');
    notice.classList.add('visible');
    setTimeout(() => notice.classList.remove('visible'), 2500);
  }

  async function saveGoal(type) {
    const val = document.getElementById(`${type}-goal`).value.trim();
    await fetch('/goals/save', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({type, goal: val})
    });
    const notice = document.getElementById(`${type}-notice`);
    notice.classList.add('visible');
    setTimeout(() => notice.classList.remove('visible'), 2500);
  }

  async function suggestGoal(type) {
    const btn = event.target;
    btn.disabled = true;
    btn.textContent = '提案中...';

    const res = await fetch('/goals/suggest', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({type})
    });
    const data = await res.json();

    document.getElementById(`${type}-suggestion-text`).textContent = data.suggestion;
    document.getElementById(`${type}-suggestion`).style.display = 'block';

    btn.disabled = false;
    btn.textContent = 'AIに提案してもらう';
  }

  function useSuggestion(type) {
    const text = document.getElementById(`${type}-suggestion-text`).textContent.trim();
    document.getElementById(`${type}-goal`).value = text;
    document.getElementById(`${type}-suggestion`).style.display = 'none';
  }

  document.getElementById('chat-input').addEventListener('input', function() {
    this.style.height = 'auto';
    this.style.height = Math.min(this.scrollHeight, 100) + 'px';
  });
  document.getElementById('chat-input').addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });
</script>
{% endblock %}
